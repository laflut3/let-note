[package]
name = "let-note-backend"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.102"
argon2 = "=0.5.3"
axum = { version = "=0.8.9", features = ["http2", "tokio", "macros", "multipart"] }
aws-credential-types = "=1.2.14"
aws-sdk-s3 = { version = "=1.135.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-types = "=1.3.16"
base64 = "=0.22.1"
chrono = { version = "=0.4.44", features = ["serde"] }
clap = { version = "=4.6.1", features = ["derive", "env"] }
jsonwebtoken = { version = "=10.4.0", features = ["rust_crypto"] }
lettre = { version = "=0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rand = "=0.10.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["full"] }
tower-http = { version = "=0.6.11", features = ["cors"] }
uuid = { version = "=1.23.2", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
