apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: let-note-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/laflut3/let-note.git
    targetRevision: main
    path: infrastructure/deploiement-kube/environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
