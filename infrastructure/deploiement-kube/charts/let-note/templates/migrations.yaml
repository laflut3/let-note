{{- $migrationFiles := .Files.Glob "migrations/*.up.sql" }}
{{- $migrationsChecksum := $migrationFiles.AsConfig | sha256sum | trunc 12 }}
{{- if and .Values.migrations.enabled $migrationFiles }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-migrations
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: db-migration
    {{- include "let-note.commonLabels" . | nindent 4 }}
data:
{{- range $path, $_ := $migrationFiles }}
  {{ base $path }}: |-
{{ $.Files.Get $path | nindent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "db-migration-%s-%s" .Values.global.environment $migrationsChecksum | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: db-migration
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: db-migration
        {{- include "let-note.commonLabels" . | nindent 8 }}
    spec:
      serviceAccountName: let-note-backend
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: render-postgres-password
        image: python:3.12-alpine
        command:
        - python
        - /scripts/render_vault_env.py
        env:
        - name: VAULT_ADDR
          value: {{ .Values.backend.vault.addr | quote }}
        - name: VAULT_KV_MOUNT
          value: {{ .Values.backend.vault.kvMount | quote }}
        - name: VAULT_SECRET_PATH
          value: {{ .Values.backend.vault.secretPath | quote }}
        - name: VAULT_AUTH_METHOD
          value: {{ .Values.backend.vault.authMethod | quote }}
        - name: VAULT_K8S_AUTH_MOUNT
          value: {{ .Values.backend.vault.k8sAuthMount | quote }}
        - name: VAULT_K8S_ROLE
          value: {{ .Values.backend.vault.k8sRole | quote }}
        - name: VAULT_ENV_OUTPUT_PATH
          value: /vault/secrets/postgres.env
        - name: VAULT_ENV_MAPPINGS
          value: PGPASSWORD=PS_BDD_PASS
        volumeMounts:
        - name: vault-env-bootstrap
          mountPath: /scripts
          readOnly: true
        - name: vault-secrets
          mountPath: /vault/secrets
      containers:
      - name: migrate
        image: {{ include "let-note.image" .Values.images.postgres | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: postgres-config
        command:
        - sh
        - -ec
        - |
          . /vault/secrets/postgres.env

          until pg_isready -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"; do
            echo "waiting for postgres"
            sleep 5
          done

          psql -h postgres -v ON_ERROR_STOP=1 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
            -c "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());"

          for migration in /migrations/*.up.sql; do
            migration_name="$(basename "${migration}")"
            applied="$(psql -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -tAc "SELECT 1 FROM schema_migrations WHERE version = '${migration_name}'")"
            if [ "${applied}" = "1" ]; then
              echo "skip ${migration_name}"
              continue
            fi

            echo "apply ${migration_name}"
            psql -h postgres -v ON_ERROR_STOP=1 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -f "${migration}"
            psql -h postgres -v ON_ERROR_STOP=1 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
              -c "INSERT INTO schema_migrations(version) VALUES ('${migration_name}');"
          done
        volumeMounts:
        - name: migrations
          mountPath: /migrations
          readOnly: true
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true
        resources:
          {{- toYaml .Values.migrations.resources | nindent 10 }}
      volumes:
      - name: migrations
        configMap:
          name: db-migrations
      - name: vault-env-bootstrap
        configMap:
          name: vault-env-bootstrap
          defaultMode: 0555
      - name: vault-secrets
        emptyDir: {}
{{- end }}
