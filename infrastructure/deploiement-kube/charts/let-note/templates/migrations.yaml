{{- $migrationFiles := .Files.Glob "migrations/*.up.sql" }}
{{- if and .Values.migrations.enabled $migrationFiles }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-migrations
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: db-migration
    {{- include "let-note.commonLabels" . | nindent 4 }}
data:
{{- range $path, $_ := $migrationFiles }}
  {{ base $path }}: |-
{{ $.Files.Get $path | nindent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "db-migration-%s-%d" .Values.global.environment .Release.Revision | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: db-migration
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: db-migration
        {{- include "let-note.commonLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: {{ include "let-note.image" .Values.images.postgres | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: postgres-config
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        command:
        - sh
        - -ec
        - |
          until pg_isready -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"; do
            echo "waiting for postgres"
            sleep 5
          done

          psql -h postgres -v ON_ERROR_STOP=1 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
            -c "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());"

          for migration in /migrations/*.up.sql; do
            migration_name="$(basename "${migration}")"
            applied="$(psql -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -tAc "SELECT 1 FROM schema_migrations WHERE version = '${migration_name}'")"
            if [ "${applied}" = "1" ]; then
              echo "skip ${migration_name}"
              continue
            fi

            echo "apply ${migration_name}"
            psql -h postgres -v ON_ERROR_STOP=1 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -f "${migration}"
            psql -h postgres -v ON_ERROR_STOP=1 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
              -c "INSERT INTO schema_migrations(version) VALUES ('${migration_name}');"
          done
        volumeMounts:
        - name: migrations
          mountPath: /migrations
          readOnly: true
        resources:
          {{- toYaml .Values.migrations.resources | nindent 10 }}
      volumes:
      - name: migrations
        configMap:
          name: db-migrations
{{- end }}
