{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ include "let-note.namespace" . }}
  labels:
    {{- include "let-note.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-secret
  namespace: {{ include "let-note.namespace" . }}
  labels:
    {{- include "let-note.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY: {{ .Values.secrets.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3.secretKey | quote }}
{{- end }}
