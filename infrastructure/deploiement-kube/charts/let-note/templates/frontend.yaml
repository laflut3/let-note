apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: front
    app.kubernetes.io/name: front
    app.kubernetes.io/component: frontend
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: {{ .Values.frontend.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.frontend.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
        app.kubernetes.io/name: front
        app.kubernetes.io/component: frontend
        {{- include "let-note.commonLabels" . | nindent 8 }}
      annotations:
        let-note.io/deploy-id: {{ .Values.global.deployId | quote }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: front
        image: {{ include "let-note.image" .Values.images.frontend | quote }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: front-config
        env:
        - name: APP_CONFIG_PATH
          value: /etc/let-note/app-config.yaml
        volumeMounts:
        - name: app-config-volume
          mountPath: /etc/let-note
          readOnly: true
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-tmp
          mountPath: /tmp
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
      volumes:
      - name: app-config-volume
        configMap:
          name: app-config
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: front
    app.kubernetes.io/name: front
    app.kubernetes.io/component: frontend
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  selector:
    app: front
  ports:
  - port: 80
    targetPort: 80
