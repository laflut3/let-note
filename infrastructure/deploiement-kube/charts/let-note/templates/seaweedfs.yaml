apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweed-master
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: seaweed-master
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.seaweedfs.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.seaweedfs.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: seaweed-master
  template:
    metadata:
      labels:
        app: seaweed-master
        {{- include "let-note.commonLabels" . | nindent 8 }}
    spec:
      containers:
      - name: seaweed-master
        image: {{ include "let-note.image" .Values.images.seaweedfs | quote }}
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        args:
        - master
        - -ip=$(POD_IP)
        - -ip.bind=0.0.0.0
        - -mdir=/data/master
        ports:
        - containerPort: 9333
        volumeMounts:
        - name: master-data
          mountPath: /data/master
        resources:
          {{- toYaml .Values.seaweedfs.resources | nindent 10 }}
      volumes:
      - name: master-data
        persistentVolumeClaim:
          claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seaweed-master
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: seaweed-master
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  selector:
    app: seaweed-master
  ports:
  - port: 9333
    targetPort: 9333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweed-volume
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: seaweed-volume
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.seaweedfs.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.seaweedfs.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: seaweed-volume
  template:
    metadata:
      labels:
        app: seaweed-volume
        {{- include "let-note.commonLabels" . | nindent 8 }}
    spec:
      containers:
      - name: seaweed-volume
        image: {{ include "let-note.image" .Values.images.seaweedfs | quote }}
        args:
        - volume
        - -mserver=seaweed-master:9333
        - -ip=seaweed-volume
        - -port=8080
        - -dir=/data/volume
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: volume-data
          mountPath: /data/volume
        resources:
          {{- toYaml .Values.seaweedfs.resources | nindent 10 }}
      volumes:
      - name: volume-data
        persistentVolumeClaim:
          claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seaweed-volume
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: seaweed-volume
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  selector:
    app: seaweed-volume
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweed-filer
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: seaweed-filer
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.seaweedfs.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.seaweedfs.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: seaweed-filer
  template:
    metadata:
      labels:
        app: seaweed-filer
        {{- include "let-note.commonLabels" . | nindent 8 }}
    spec:
      containers:
      - name: seaweed-filer
        image: {{ include "let-note.image" .Values.images.seaweedfs | quote }}
        args: ["filer", "-master=seaweed-master:9333", "-ip=seaweed-filer", "-port=8888"]
        ports:
        - containerPort: 8888
        resources:
          {{- toYaml .Values.seaweedfs.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweed-filer
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: seaweed-filer
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  selector:
    app: seaweed-filer
  ports:
  - port: 8888
    targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweed-s3
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: seaweed-s3
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.seaweedfs.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.seaweedfs.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: seaweed-s3
  template:
    metadata:
      labels:
        app: seaweed-s3
        {{- include "let-note.commonLabels" . | nindent 8 }}
    spec:
      serviceAccountName: let-note-backend
      volumes:
      - name: s3-config
        emptyDir: {}
      - name: s3-bootstrap
        configMap:
          name: seaweed-s3-bootstrap
          defaultMode: 0555
      initContainers:
      - name: render-s3-config
        image: python:3.12-alpine
        command:
        - python
        - /scripts/render_s3_config.py
        env:
        - name: VAULT_ADDR
          value: {{ .Values.backend.vault.addr | quote }}
        - name: VAULT_KV_MOUNT
          value: {{ .Values.backend.vault.kvMount | quote }}
        - name: VAULT_SECRET_PATH
          value: {{ .Values.backend.vault.secretPath | quote }}
        - name: VAULT_AUTH_METHOD
          value: {{ .Values.backend.vault.authMethod | quote }}
        - name: VAULT_K8S_AUTH_MOUNT
          value: {{ .Values.backend.vault.k8sAuthMount | quote }}
        - name: VAULT_K8S_ROLE
          value: {{ .Values.backend.vault.k8sRole | quote }}
        - name: SEAWEEDFS_S3_CONFIG_PATH
          value: /etc/seaweedfs/s3.conf
        - name: SEAWEEDFS_S3_IDENTITY_NAME
          value: {{ .Values.seaweedfs.s3.identityName | quote }}
        volumeMounts:
        - name: s3-bootstrap
          mountPath: /scripts
          readOnly: true
        - name: s3-config
          mountPath: /etc/seaweedfs
      containers:
      - name: seaweed-s3
        image: {{ include "let-note.image" .Values.images.seaweedfs | quote }}
        args:
        - s3
        - -filer=seaweed-filer:8888
        - -port=8333
        - -iam=false
        - -config=/etc/seaweedfs/s3.conf
        ports:
        - containerPort: 8333
        volumeMounts:
        - name: s3-config
          mountPath: /etc/seaweedfs
        resources:
          {{- toYaml .Values.seaweedfs.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweed-s3
  namespace: {{ include "let-note.namespace" . }}
  labels:
    app: seaweed-s3
    {{- include "let-note.commonLabels" . | nindent 4 }}
spec:
  selector:
    app: seaweed-s3
  ports:
  - port: 8333
    targetPort: 8333
