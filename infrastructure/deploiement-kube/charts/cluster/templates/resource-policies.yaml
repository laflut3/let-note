{{- range $environment := .Values.environments }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: {{ $environment.name }}
spec:
  hard:
    {{- toYaml $environment.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: {{ $environment.name }}
spec:
  limits:
  - type: Container
    defaultRequest:
      {{- toYaml $environment.limits.defaultRequest | nindent 6 }}
    default:
      {{- toYaml $environment.limits.default | nindent 6 }}
{{- end }}
