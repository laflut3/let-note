apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    spec:
      containers:
      - name: backend
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 800m
            memory: 1024Mi
---
