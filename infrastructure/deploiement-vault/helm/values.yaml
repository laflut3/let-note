global:
  enabled: true
  tlsDisable: true

server:
  enabled: true

  standalone:
    enabled: true
    config: |
      ui = true
      disable_mlock = true

      listener "tcp" {
        address = "0.0.0.0:18200"
        cluster_address = "0.0.0.0:18201"
        tls_disable = 1
      }

      storage "file" {
        path = "/vault/data"
      }

      api_addr = "https://vault.127.0.0.1.nip.io"
      cluster_addr = "http://vault.vault.svc.cluster.local:18201"

  extraEnvironmentVars:
    SKIP_CHOWN: "true"
    SKIP_SETCAP: "true"

  service:
    enabled: true
    port: 18200
    targetPort: 18200

  dataStorage:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: vault.127.0.0.1.nip.io
        paths:
          - /
    tls:
      - hosts:
          - vault.127.0.0.1.nip.io

  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: vault
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: default
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: dev
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: staging
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: prod
        ports:
          - protocol: TCP
            port: 18200
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
