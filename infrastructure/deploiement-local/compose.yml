services:
  postgres:
    image: postgres:18@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PS_BDD_DB:-let_note_dev}
      POSTGRES_USER: ${PS_BDD_USER:-let_note}
      POSTGRES_PASSWORD: ${PS_BDD_PASS:-let_note_dev_password_change_me}
    ports:
      - "${PS_BDD_PORT:-5432}:5432"
    volumes:
      - db_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PS_BDD_USER:-let_note} -d ${PS_BDD_DB:-let_note_dev}"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-migrate:
    image: postgres:18@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${PS_BDD_PASS:-let_note_dev_password_change_me}
      PS_BDD_DB: ${PS_BDD_DB:-let_note_dev}
      PS_BDD_USER: ${PS_BDD_USER:-let_note}
    volumes:
      - ../deploiement-kube/charts/let-note/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        psql -h postgres -U "$${PS_BDD_USER}" -d "$${PS_BDD_DB}" -v ON_ERROR_STOP=1 \
          -c "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());"
        for f in $(find /migrations -maxdepth 1 -type f -name "*.up.sql" | sort); do
          migration_name="$$(basename "$${f}")"
          applied="$$(psql -h postgres -U "$${PS_BDD_USER}" -d "$${PS_BDD_DB}" -tAc "SELECT 1 FROM schema_migrations WHERE version = '$${migration_name}'")"
          if [ "$${applied}" = "1" ]; then
            echo "Skipping migration: $${migration_name}"
            continue
          fi

          echo "Applying migration: $${migration_name}"
          psql -h postgres -U "$${PS_BDD_USER}" -d "$${PS_BDD_DB}" -v ON_ERROR_STOP=1 -f "$${f}"
          psql -h postgres -U "$${PS_BDD_USER}" -d "$${PS_BDD_DB}" -v ON_ERROR_STOP=1 \
            -c "INSERT INTO schema_migrations(version) VALUES ('$${migration_name}');"
        done
        echo "Migrations applied"

  backend:
    build: ../../backend
    restart: unless-stopped
    develop:
      watch:
        - path: ../../backend
          action: rebuild
          ignore:
            - target/
            - .git/
        - path: ../../backend/Dockerfile
          action: rebuild
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      PS_BDD_SERVER: postgres
      PS_BDD_PORT: 5432
      PS_BDD_DB: ${PS_BDD_DB:-let_note_dev}
      PS_BDD_USER: ${PS_BDD_USER:-let_note}
      PS_BDD_PASS: ${PS_BDD_PASS:-let_note_dev_password_change_me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@let-note.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123456!}
      ADMIN_PRENOM: ${ADMIN_PRENOM:-Super}
      ADMIN_NOM: ${ADMIN_NOM:-Admin}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweed-s3:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-let-note-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-seaweedfs}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweedfs}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${BACKEND_PORT:-8081}:8080"

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    develop:
      watch:
        - path: ../../frontend
          action: rebuild
          ignore:
            - node_modules/
            - dist/
            - .git/
        - path: ../../frontend/Dockerfile
          action: rebuild
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
      - seaweed-s3

  seaweed-master:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    user: "0:0"
    command: "master -ip=seaweed-master -mdir=/data"
    restart: unless-stopped
    ports:
      - "9333:9333"
    volumes:
      - seaweed_master_data:/data

  seaweed-volume:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    user: "0:0"
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -port=8080 -dir=/data"
    restart: unless-stopped
    depends_on:
      - seaweed-master
    ports:
      - "8080:8080"
    volumes:
      - seaweed_volume_data:/data

  seaweed-filer:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    user: "0:0"
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer -port=8888"
    restart: unless-stopped
    depends_on:
      - seaweed-master
      - seaweed-volume
    ports:
      - "8888:8888"

  seaweed-s3:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    user: "0:0"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-seaweedfs}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweedfs}
    command: "s3 -filer=seaweed-filer:8888 -port=8333 -iam=false -allowEmptyFolder=false -config=/etc/seaweedfs/s3.conf"
    depends_on:
      - seaweed-filer
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - ./seaweed/s3.conf:/etc/seaweedfs/s3.conf:ro

volumes:
  db_data_pg18:
  seaweed_master_data:
  seaweed_volume_data:
