apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  labels:
    app: front
    app.kubernetes.io/name: front
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: let-note
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
        app.kubernetes.io/name: front
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: let-note
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: front
        image: ghcr.io/ltorres/let-note-frontend:latest
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: front-config
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: front
  labels:
    app: front
    app.kubernetes.io/name: front
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: let-note
spec:
  selector:
    app: front
  ports:
  - port: 80
    targetPort: 8080
