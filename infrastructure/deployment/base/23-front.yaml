apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  labels:
    app: front
    app.kubernetes.io/name: front
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: let-note
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
        app.kubernetes.io/name: front
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: let-note
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: front
        image: ghcr.io/laflut3/let-note-frontend:latest
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - NET_RAW
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: front-config
        env:
        - name: APP_CONFIG_PATH
          value: /etc/let-note/app-config.yaml
        volumeMounts:
        - name: app-config-volume
          mountPath: /etc/let-note
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
      volumes:
      - name: app-config-volume
        configMap:
          name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: front
  labels:
    app: front
    app.kubernetes.io/name: front
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: let-note
spec:
  selector:
    app: front
  ports:
  - port: 80
    targetPort: 80
