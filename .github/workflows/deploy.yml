name: Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      target_architecture:
        description: Cluster architecture to deploy
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
          - both

permissions:
  contents: read
  packages: read

env:
  PROD_INGRESS_HOST: let-note.prod.polydo.dev

jobs:
  validate-selection:
    name: Validate deploy selection
    runs-on: ubuntu-24.04
    outputs:
      deploy_version: ${{ steps.meta.outputs.deploy_version }}
      deploy_matrix: ${{ steps.meta.outputs.deploy_matrix }}
    steps:
      - name: Validate deploy context
        id: meta
        uses: actions/github-script@v8
        with:
          script: |
            const refType = context.ref.startsWith("refs/tags/") ? "tag" : "branch";
            const refName = context.ref.replace(/^refs\/tags\//, "").replace(/^refs\/heads\//, "");
            const environment = "${{ inputs.target_environment }}";
            const architecture = "${{ inputs.target_architecture }}";

            if (refType !== "tag") {
              core.setFailed("Deploy workflow must be manually run from a Git tag.");
              return;
            }

            if (!new Set(["dev", "staging", "prod"]).has(environment)) {
              core.setFailed(`Invalid target environment '${environment}'.`);
              return;
            }

            if (!new Set(["amd64", "arm64", "both"]).has(architecture)) {
              core.setFailed(`Invalid target architecture '${architecture}'.`);
              return;
            }

            const targets = architecture === "both" ? ["amd64", "arm64"] : [architecture];
            const include = targets.map(arch => ({
              arch,
              kubeconfig_secret: `KUBE_CONFIG_${arch.toUpperCase()}`,
            }));
            core.setOutput("deploy_version", refName.replace(/^v/, ""));
            core.setOutput("deploy_matrix", JSON.stringify({ include }));

  deploy:
    name: Deploy ${{ inputs.target_environment }} ${{ matrix.arch }}
    needs: validate-selection
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target_environment }}-${{ matrix.arch }}
    concurrency:
      group: deploy-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-selection.outputs.deploy_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        uses: ./.github/actions/helm-deploy
        with:
          arch: ${{ matrix.arch }}
          environment: ${{ inputs.target_environment }}
          kubeconfig: ${{ secrets[matrix.kubeconfig_secret] }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}
