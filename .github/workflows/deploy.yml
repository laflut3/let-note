name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: Deploy dev
        required: true
        type: boolean
        default: false
      deploy_staging:
        description: Deploy staging
        required: true
        type: boolean
        default: false
      deploy_prod:
        description: Deploy prod
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

env:
  CONTAINER_REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: laflut3/let-note-backend
  FRONTEND_IMAGE_NAME: laflut3/let-note-frontend
  PROD_INGRESS_HOST: let-note.prod.polydo.dev

jobs:
  validate-selection:
    name: Validate deploy selection
    runs-on: ubuntu-24.04
    outputs:
      deploy_version: ${{ steps.meta.outputs.deploy_version }}
      deploy_dev: ${{ steps.meta.outputs.deploy_dev }}
      deploy_staging: ${{ steps.meta.outputs.deploy_staging }}
      deploy_prod: ${{ steps.meta.outputs.deploy_prod }}
    steps:
      - name: Validate tag and selected environments
        id: meta
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEPLOY_DEV: ${{ inputs.deploy_dev }}
          DEPLOY_STAGING: ${{ inputs.deploy_staging }}
          DEPLOY_PROD: ${{ inputs.deploy_prod }}
        run: |
          set -euo pipefail

          if [ "${REF_TYPE}" != "tag" ]; then
            echo "::error title=Invalid ref::Deploy workflow must be manually run from a Git tag."
            exit 1
          fi

          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "${REF_NAME}" =~ ${semver_re} ]]; then
            echo "::error title=Invalid SemVer Tag::Deploy tag '${REF_NAME}' must match vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]."
            exit 1
          fi

          if [ "${DEPLOY_DEV}" != "true" ] && [ "${DEPLOY_STAGING}" != "true" ] && [ "${DEPLOY_PROD}" != "true" ]; then
            echo "::error title=No environment selected::Select at least one environment to deploy."
            exit 1
          fi

          {
            echo "deploy_version=${REF_NAME#v}"
            echo "deploy_dev=${DEPLOY_DEV}"
            echo "deploy_staging=${DEPLOY_STAGING}"
            echo "deploy_prod=${DEPLOY_PROD}"
          } >> "${GITHUB_OUTPUT}"

  deploy-dev-amd64:
    name: Deploy dev amd64
    needs: validate-selection
    if: needs.validate-selection.outputs.deploy_dev == 'true'
    runs-on: ubuntu-24.04
    environment: dev-amd64
    concurrency:
      group: deploy-amd64
      cancel-in-progress: false
    env:
      DEPLOY_ARCH: amd64
      DEPLOY_ENV: dev
      DEPLOY_VERSION: ${{ needs.validate-selection.outputs.deploy_version }}
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_AMD64_B64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KUBE_CONFIG_B64}" ]; then
            echo "::error title=Missing secret::KUBE_CONFIG_AMD64_B64 is required."
            exit 1
          fi

          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBE_CONFIG_B64}" | base64 -d > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release images
        shell: bash
        run: |
          set -euo pipefail

          image_tag="${DEPLOY_VERSION}-${DEPLOY_ARCH}"
          docker buildx imagetools inspect "${CONTAINER_REGISTRY}/${BACKEND_IMAGE_NAME}:${image_tag}"
          docker buildx imagetools inspect "${CONTAINER_REGISTRY}/${FRONTEND_IMAGE_NAME}:${image_tag}"

      - name: Deploy cluster chart
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade --install let-note-cluster ./infrastructure/deploiement-kube/charts/cluster \
            --atomic \
            --wait \
            --timeout 5m

      - name: Deploy app chart
        shell: bash
        run: |
          set -euo pipefail

          image_tag="${DEPLOY_VERSION}-${DEPLOY_ARCH}"
          helm upgrade --install "let-note-${DEPLOY_ENV}" ./infrastructure/deploiement-kube/charts/let-note \
            --namespace "${DEPLOY_ENV}" \
            --create-namespace \
            --values "./infrastructure/deploiement-kube/charts/let-note/environments/${DEPLOY_ENV}.yaml" \
            --set "secrets.create=false" \
            --set-string "images.backend.tag=${image_tag}" \
            --set-string "images.frontend.tag=${image_tag}" \
            --set-string "global.deployId=${DEPLOY_ENV}-${image_tag}-${GITHUB_RUN_ID}" \
            --atomic \
            --wait \
            --timeout 10m

