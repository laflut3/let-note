          docker buildx imagetools inspect "${CONTAINER_REGISTRY}/${FRONTEND_IMAGE_NAME}:${image_tag}"

      - name: Guard TLS certificate
        shell: bash
        run: |
          set -euo pipefail

          current_hosts="$(kubectl -n prod get certificate app-tls -o jsonpath='{.spec.dnsNames[*]}' 2>/dev/null || true)"
          if [ -z "${current_hosts}" ]; then
            exit 0
          fi

          printf '%s\n' "${current_hosts}" | tr ' ' '\n' | grep -Fx "${PROD_INGRESS_HOST}" >/dev/null || {
            echo "::error title=TLS host change blocked::Certificate prod/app-tls currently targets '${current_hosts}', expected '${PROD_INGRESS_HOST}'. Update intentionally outside this deploy workflow."
            exit 1
          }

