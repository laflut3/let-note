name: Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  packages: read

env:
  PROD_INGRESS_HOST: let-note.prod.polydo.dev

jobs:
  validate-selection:
    name: Validate deploy selection
    runs-on: ubuntu-24.04
    outputs:
      deploy_version: ${{ steps.meta.outputs.deploy_version }}
      target_environment: ${{ steps.meta.outputs.target_environment }}
    steps:
      - name: Validate deploy context
        id: meta
        uses: actions/github-script@v8
        with:
          script: |
            const refType = context.ref.startsWith("refs/tags/") ? "tag" : "branch";
            const refName = context.ref.replace(/^refs\/tags\//, "").replace(/^refs\/heads\//, "");
            const targetEnvironment = "${{ inputs.target_environment }}";
            const allowedEnvironments = new Set(["dev", "staging", "prod"]);

            if (refType !== "tag") {
              core.setFailed("Deploy workflow must be manually run from a Git tag.");
              return;
            }

            if (!allowedEnvironments.has(targetEnvironment)) {
              core.setFailed(`Invalid target environment '${targetEnvironment}'.`);
              return;
            }

            core.setOutput("deploy_version", refName.replace(/^v/, ""));
            core.setOutput("target_environment", targetEnvironment);

  deploy-dev-amd64:
    name: Deploy dev amd64
    needs: validate-selection
    if: needs.validate-selection.outputs.target_environment == 'dev'
    runs-on: ubuntu-24.04
    environment: dev-amd64
    concurrency:
      group: deploy-amd64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy dev amd64
        uses: ./.github/actions/helm-deploy
        with:
          arch: amd64
          environment: dev
          kubeconfig: ${{ secrets.KUBE_CONFIG_AMD64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}

  deploy-staging-amd64:
    name: Deploy staging amd64
    needs: validate-selection
    if: needs.validate-selection.outputs.target_environment == 'staging'
    runs-on: ubuntu-24.04
    environment: staging-amd64
    concurrency:
      group: deploy-amd64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy staging amd64
        uses: ./.github/actions/helm-deploy
        with:
          arch: amd64
          environment: staging
          kubeconfig: ${{ secrets.KUBE_CONFIG_AMD64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}

  deploy-prod-amd64:
    name: Deploy prod amd64
    needs: validate-selection
    if: needs.validate-selection.outputs.target_environment == 'prod'
    runs-on: ubuntu-24.04
    environment: prod-amd64
    concurrency:
      group: deploy-amd64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy prod amd64
        uses: ./.github/actions/helm-deploy
        with:
          arch: amd64
          environment: prod
          kubeconfig: ${{ secrets.KUBE_CONFIG_AMD64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}

  deploy-dev-arm64:
    name: Deploy dev arm64
    needs: validate-selection
    if: needs.validate-selection.outputs.target_environment == 'dev'
    runs-on: ubuntu-24.04
    environment: dev-arm64
    concurrency:
      group: deploy-arm64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy dev arm64
        uses: ./.github/actions/helm-deploy
        with:
          arch: arm64
          environment: dev
          kubeconfig: ${{ secrets.KUBE_CONFIG_ARM64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}

  deploy-staging-arm64:
    name: Deploy staging arm64
    needs: validate-selection
    if: needs.validate-selection.outputs.target_environment == 'staging'
    runs-on: ubuntu-24.04
    environment: staging-arm64
    concurrency:
      group: deploy-arm64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy staging arm64
        uses: ./.github/actions/helm-deploy
        with:
          arch: arm64
          environment: staging
          kubeconfig: ${{ secrets.KUBE_CONFIG_ARM64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}

  deploy-prod-arm64:
    name: Deploy prod arm64
    needs: validate-selection
    if: needs.validate-selection.outputs.target_environment == 'prod'
    runs-on: ubuntu-24.04
    environment: prod-arm64
    concurrency:
      group: deploy-arm64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy prod arm64
        uses: ./.github/actions/helm-deploy
        with:
          arch: arm64
          environment: prod
          kubeconfig: ${{ secrets.KUBE_CONFIG_ARM64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}
