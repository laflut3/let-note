name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: Deploy dev
        required: true
        type: boolean
        default: false
      deploy_staging:
        description: Deploy staging
        required: true
        type: boolean
        default: false
      deploy_prod:
        description: Deploy prod
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

env:
  PROD_INGRESS_HOST: let-note.prod.polydo.dev

jobs:
  validate-selection:
    name: Validate deploy selection
    runs-on: ubuntu-24.04
    outputs:
      deploy_version: ${{ steps.meta.outputs.deploy_version }}
      deploy_dev: ${{ steps.meta.outputs.deploy_dev }}
      deploy_staging: ${{ steps.meta.outputs.deploy_staging }}
      deploy_prod: ${{ steps.meta.outputs.deploy_prod }}
    steps:
      - name: Validate deploy context
        id: meta
        uses: actions/github-script@v8
        with:
          script: |
            const refType = context.ref.startsWith("refs/tags/") ? "tag" : "branch";
            const refName = context.ref.replace(/^refs\/tags\//, "").replace(/^refs\/heads\//, "");
            const deployDev = String(${{ inputs.deploy_dev }});
            const deployStaging = String(${{ inputs.deploy_staging }});
            const deployProd = String(${{ inputs.deploy_prod }});

            if (refType !== "tag") {
              core.setFailed("Deploy workflow must be manually run from a Git tag.");
              return;
            }

            if (deployDev !== "true" && deployStaging !== "true" && deployProd !== "true") {
              core.setFailed("Select at least one environment to deploy.");
              return;
            }

            core.setOutput("deploy_version", refName.replace(/^v/, ""));
            core.setOutput("deploy_dev", deployDev);
            core.setOutput("deploy_staging", deployStaging);
            core.setOutput("deploy_prod", deployProd);

  deploy-dev-amd64:
    name: Deploy dev amd64
    needs: validate-selection
    if: needs.validate-selection.outputs.deploy_dev == 'true'
    runs-on: ubuntu-24.04
    environment: dev-amd64
    concurrency:
      group: deploy-amd64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy dev amd64
        uses: ./.github/actions/helm-deploy
        with:
          arch: amd64
          environment: dev
          kubeconfig: ${{ secrets.KUBE_CONFIG_AMD64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}

  deploy-staging-amd64:
    name: Deploy staging amd64
    needs: validate-selection
    if: needs.validate-selection.outputs.deploy_staging == 'true'
    runs-on: ubuntu-24.04
    environment: staging-amd64
    concurrency:
      group: deploy-amd64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy staging amd64
        uses: ./.github/actions/helm-deploy
        with:
          arch: amd64
          environment: staging
          kubeconfig: ${{ secrets.KUBE_CONFIG_AMD64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}

  deploy-prod-amd64:
    name: Deploy prod amd64
    needs: validate-selection
    if: needs.validate-selection.outputs.deploy_prod == 'true'
    runs-on: ubuntu-24.04
    environment: prod-amd64
    concurrency:
      group: deploy-amd64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy prod amd64
        uses: ./.github/actions/helm-deploy
        with:
          arch: amd64
          environment: prod
          kubeconfig: ${{ secrets.KUBE_CONFIG_AMD64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}

  deploy-dev-arm64:
    name: Deploy dev arm64
    needs: validate-selection
    if: needs.validate-selection.outputs.deploy_dev == 'true'
    runs-on: ubuntu-24.04
    environment: dev-arm64
    concurrency:
      group: deploy-arm64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy dev arm64
        uses: ./.github/actions/helm-deploy
        with:
          arch: arm64
          environment: dev
          kubeconfig: ${{ secrets.KUBE_CONFIG_ARM64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}

  deploy-staging-arm64:
    name: Deploy staging arm64
    needs: validate-selection
    if: needs.validate-selection.outputs.deploy_staging == 'true'
    runs-on: ubuntu-24.04
    environment: staging-arm64
    concurrency:
      group: deploy-arm64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy staging arm64
        uses: ./.github/actions/helm-deploy
        with:
          arch: arm64
          environment: staging
          kubeconfig: ${{ secrets.KUBE_CONFIG_ARM64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}

  deploy-prod-arm64:
    name: Deploy prod arm64
    needs: validate-selection
    if: needs.validate-selection.outputs.deploy_prod == 'true'
    runs-on: ubuntu-24.04
    environment: prod-arm64
    concurrency:
      group: deploy-arm64
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy prod arm64
        uses: ./.github/actions/helm-deploy
        with:
          arch: arm64
          environment: prod
          kubeconfig: ${{ secrets.KUBE_CONFIG_ARM64 }}
          version: ${{ needs.validate-selection.outputs.deploy_version }}
          prod-ingress-host: ${{ env.PROD_INGRESS_HOST }}
