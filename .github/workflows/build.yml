name: Build app

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/build.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: laflut3/let-note-backend
  FRONTEND_IMAGE_NAME: laflut3/let-note-frontend
  BACKEND_CACHE_IMAGE: ghcr.io/laflut3/let-note-backend-buildcache
  FRONTEND_CACHE_IMAGE: ghcr.io/laflut3/let-note-frontend-buildcache

jobs:
  build-backend-amd64:
    name: Build backend amd64 image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          push: ${{ github.event_name == 'push' }} # Only push the image if we're on main
          platforms: linux/amd64
          context: ./backend
          file: ./backend/Dockerfile
          outputs: type=image,name=${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=registry,ref=${{ env.BACKEND_CACHE_IMAGE }}:amd64
          cache-to: type=registry,ref=${{ env.BACKEND_CACHE_IMAGE }}:amd64,mode=max

  build-backend-arm64:
    name: Build backend arm64 image
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          push: ${{ github.event_name == 'push' }} # Only push the image if we're on main
          platforms: linux/arm64
          context: ./backend
          file: ./backend/Dockerfile
          outputs: type=image,name=${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=registry,ref=${{ env.BACKEND_CACHE_IMAGE }}:arm64
          cache-to: type=registry,ref=${{ env.BACKEND_CACHE_IMAGE }}:arm64,mode=max

  merge-backend-manifest:
    name: Merge backend multi-arch image
    runs-on: ubuntu-24.04
    needs:
      - build-backend-amd64
      - build-backend-arm64
    if: github.event_name == 'push'
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Create and push manifest
        run: >-
          docker buildx imagetools create -t ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}@${{ needs.build-backend-amd64.outputs.digest }}
          ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}@${{ needs.build-backend-arm64.outputs.digest }}

  build-frontend-amd64:
    name: Build frontend amd64 image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          context: ./frontend
          file: ./frontend/Dockerfile
          outputs: type=image,name=${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=registry,ref=${{ env.FRONTEND_CACHE_IMAGE }}:amd64
          cache-to: type=registry,ref=${{ env.FRONTEND_CACHE_IMAGE }}:amd64,mode=max

  build-frontend-arm64:
    name: Build frontend arm64 image
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          push: ${{ github.event_name == 'push' }}
          platforms: linux/arm64
          context: ./frontend
          file: ./frontend/Dockerfile
          outputs: type=image,name=${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=registry,ref=${{ env.FRONTEND_CACHE_IMAGE }}:arm64
          cache-to: type=registry,ref=${{ env.FRONTEND_CACHE_IMAGE }}:arm64,mode=max

  merge-frontend-manifest:
    name: Merge frontend multi-arch image
    runs-on: ubuntu-24.04
    needs:
      - build-frontend-amd64
      - build-frontend-arm64
    if: github.event_name == 'push'
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Create and push manifest
        run: >-
          docker buildx imagetools create -t ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}@${{ needs.build-frontend-amd64.outputs.digest }}
          ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}@${{ needs.build-frontend-arm64.outputs.digest }}
