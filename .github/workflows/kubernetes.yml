name: Kubernetes manifests

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - .github/workflows/kubernetes.yml
      - infrastructure/deploiement-kube/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    name: Helm ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        environment:
          - dev
          - staging
          - prod
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Lint cluster chart
        run: helm lint infrastructure/deploiement-kube/charts/cluster

      - name: Lint app chart
        run: >-
          helm lint infrastructure/deploiement-kube/charts/let-note
          --values infrastructure/deploiement-kube/charts/let-note/environments/${{ matrix.environment }}.yaml
          --set secrets.create=false

      - name: Render charts
        run: |
          helm template let-note-cluster infrastructure/deploiement-kube/charts/cluster >/dev/null
          helm template "let-note-${{ matrix.environment }}" infrastructure/deploiement-kube/charts/let-note \
            --namespace "${{ matrix.environment }}" \
            --values "infrastructure/deploiement-kube/charts/let-note/environments/${{ matrix.environment }}.yaml" \
            --set secrets.create=false \
            >/dev/null
