name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  CONTAINER_REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: laflut3/let-note-backend
  FRONTEND_IMAGE_NAME: laflut3/let-note-frontend

jobs:
  oci-image:
    name: Build and push release OCI image
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check tag is SemVer
        shell: bash
        run: |
          set -euo pipefail

          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'

          if [[ ! "${RELEASE_TAG}" =~ ${semver_re} ]]; then
            echo "::error title=Invalid SemVer Tag::RELEASE FAILED: Tag '${RELEASE_TAG}' is not SemVer compliant. Expected format: vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]. Examples: v1.0.0, v2.1.3-beta, v1.0.0+build.123"
            exit 1
          fi

          echo "✅ Tag '${RELEASE_TAG}' is valid SemVer"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote OCI images
        env:
          IMAGES: >-
            ${{ env.BACKEND_IMAGE_NAME }}
            ${{ env.FRONTEND_IMAGE_NAME }}
        run: |
          set -euo pipefail

          docker_tag="${RELEASE_TAG#v}"

          for image in ${IMAGES}; do
            source="${CONTAINER_REGISTRY}/${image}:${GITHUB_SHA}"
            docker buildx imagetools inspect "${source}"

            docker buildx imagetools create \
              -t "${CONTAINER_REGISTRY}/${image}:${docker_tag}" \
              -t "${CONTAINER_REGISTRY}/${image}:latest" \
              "${source}"

            for arch in amd64 arm64; do
              digest="$(docker buildx imagetools inspect "${source}" --raw \
                | jq -r --arg arch "${arch}" '.manifests[] | select(.platform.architecture==$arch and .platform.os=="linux") | .digest')"
              test -n "${digest}"
              docker buildx imagetools create \
                -t "${CONTAINER_REGISTRY}/${image}:${docker_tag}-${arch}" \
                "${CONTAINER_REGISTRY}/${image}@${digest}"
            done
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true

      - name: Checkout main for GitOps promotion
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          token: ${{ secrets.GITOPS_TOKEN || github.token }}

      - name: Promote production desired state
        id: promote_prod
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          export DOCKER_TAG="${IMAGE_TAG#v}"
          values_file="infrastructure/deploiement-kube/charts/let-note/environments/prod.yaml"

          ruby <<'RUBY'
          require "yaml"

          values_file = "infrastructure/deploiement-kube/charts/let-note/environments/prod.yaml"
          values = YAML.load_file(values_file)
          values["global"] ||= {}
          values["images"] ||= {}
          values["images"]["backend"] ||= {}
          values["images"]["frontend"] ||= {}
          values["images"]["backend"]["tag"] = ENV.fetch("DOCKER_TAG")
          values["images"]["frontend"]["tag"] = ENV.fetch("DOCKER_TAG")
          values["global"]["deployId"] = ENV.fetch("GITHUB_SHA")
          File.write(values_file, values.to_yaml)
          RUBY

          if git diff --quiet -- "${values_file}"; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open production promotion pull request
        if: steps.promote_prod.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN || github.token }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          docker_tag="${IMAGE_TAG#v}"
          branch="gitops/promote-prod-${docker_tag}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add infrastructure/deploiement-kube/charts/let-note/environments/prod.yaml
          git commit -m "deploy(prod): promote ${docker_tag}"
          git push origin "${branch}"

          pr_url="$(gh pr create \
            --base main \
            --head "${branch}" \
            --title "deploy(prod): promote ${docker_tag}" \
            --body "Promotes Let-Note ${docker_tag} to prod. Argo CD will synchronize after merge.")"

          gh pr merge "${pr_url}" --squash --auto
