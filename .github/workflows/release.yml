name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: laflut3/let-note-backend
  FRONTEND_IMAGE_NAME: laflut3/let-note-frontend

jobs:
  oci-image:
    name: Build and push release OCI image
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check tag is SemVer
        shell: bash
        run: |
          set -euo pipefail

          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'

          if [[ ! "${RELEASE_TAG}" =~ ${semver_re} ]]; then
            echo "::error title=Invalid SemVer Tag::RELEASE FAILED: Tag '${RELEASE_TAG}' is not SemVer compliant. Expected format: vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]. Examples: v1.0.0, v2.1.3-beta, v1.0.0+build.123"
            exit 1
          fi

          echo "✅ Tag '${RELEASE_TAG}' is valid SemVer"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check backend source image exists
        run: |
          docker buildx imagetools inspect \
            ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Check frontend source image exists
        run: |
          docker buildx imagetools inspect \
            ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Tag and push backend release image
        run: |
          DOCKER_TAG="${RELEASE_TAG#v}"
          docker buildx imagetools create \
            -t ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${DOCKER_TAG} \
            ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Tag and push backend latest image
        run: |
          docker buildx imagetools create \
            -t ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest \
            ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Tag and push backend release image (amd64)
        run: |
          DOCKER_TAG="${RELEASE_TAG#v}"
          AMD64_DIGEST="$(docker buildx imagetools inspect ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} --raw \
            | jq -r '.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest')"
          test -n "${AMD64_DIGEST}"
          docker buildx imagetools create \
            -t ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${DOCKER_TAG}-amd64 \
            ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}@${AMD64_DIGEST}

      - name: Tag and push backend release image (arm64)
        run: |
          DOCKER_TAG="${RELEASE_TAG#v}"
          ARM64_DIGEST="$(docker buildx imagetools inspect ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} --raw \
            | jq -r '.manifests[] | select(.platform.architecture=="arm64" and .platform.os=="linux") | .digest')"
          test -n "${ARM64_DIGEST}"
          docker buildx imagetools create \
            -t ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${DOCKER_TAG}-arm64 \
            ${{ env.CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}@${ARM64_DIGEST}

      - name: Tag and push frontend release image
        run: |
          DOCKER_TAG="${RELEASE_TAG#v}"
          docker buildx imagetools create \
            -t ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${DOCKER_TAG} \
            ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Tag and push frontend latest image
        run: |
          docker buildx imagetools create \
            -t ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest \
            ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Tag and push frontend release image (amd64)
        run: |
          DOCKER_TAG="${RELEASE_TAG#v}"
          AMD64_DIGEST="$(docker buildx imagetools inspect ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} --raw \
            | jq -r '.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest')"
          test -n "${AMD64_DIGEST}"
          docker buildx imagetools create \
            -t ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${DOCKER_TAG}-amd64 \
            ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}@${AMD64_DIGEST}

      - name: Tag and push frontend release image (arm64)
        run: |
          DOCKER_TAG="${RELEASE_TAG#v}"
          ARM64_DIGEST="$(docker buildx imagetools inspect ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} --raw \
            | jq -r '.manifests[] | select(.platform.architecture=="arm64" and .platform.os=="linux") | .digest')"
          test -n "${ARM64_DIGEST}"
          docker buildx imagetools create \
            -t ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${DOCKER_TAG}-arm64 \
            ${{ env.CONTAINER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}@${ARM64_DIGEST}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
