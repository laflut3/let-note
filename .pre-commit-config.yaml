repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict # Detects files that would clash on case-insensitive filesystems
      - id: check-merge-conflict # Blocks unresolved Git conflict markers (<<<<<<<, =======, >>>>>>>)
      - id: check-symlinks # Verifies symlinks are valid and not broken
      - id: destroyed-symlinks # Detects symlinks accidentally replaced by plain files
      - id: check-toml
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^infrastructure/deploiement-kube/charts/.*/templates/.*\.yaml$
      - id: mixed-line-ending # Normalizes/flags inconsistent line endings (LF/CRLF)
      - id: detect-private-key # Prevents committing private keys/secrets
      - id: end-of-file-fixer # Ensures files end with a single trailing newline
      - id: trailing-whitespace # Removes trailing spaces/tabs
      - id: check-added-large-files # Blocks accidentally adding large files

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
  - repo: local
    hooks:
      - id: rust-format
        name: Rust format
        entry: cargo fmt --all --
        # Formats Rust code according to rustfmt rules
        pass_filenames: false
        types: [file, rust]
        language: system

      - id: rust-clippy
        name: Rust clippy
        entry: cargo clippy --workspace --all-targets --
        # Runs Rust lints to catch common mistakes and bad patterns
        pass_filenames: false
        types: [file, rust]
        language: system

      - id: frontend-lint
        name: Frontend lint
        entry: eslint
        args: [--config, frontend/eslint.config.cjs, frontend]
        # Runs ESLint in pre-commit's isolated Node env using the standard project config
        pass_filenames: false
        files: ^frontend/
        language: node
        additional_dependencies:
          - eslint@9.30.0
          - "@typescript-eslint/parser@8.46.2"
          - "@typescript-eslint/eslint-plugin@8.46.2"

      - id: frontend-format
        name: Frontend format check
        entry: prettier
        args: [--check, frontend]
        # Runs Prettier check in pre-commit's isolated node env
        pass_filenames: false
        files: ^frontend/
        language: node
        additional_dependencies:
          - prettier@3.6.2
